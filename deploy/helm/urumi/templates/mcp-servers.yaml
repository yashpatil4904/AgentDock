apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  namespace: {{ .Values.namespaces.shop }}
  labels:
    app.kubernetes.io/name: woocommerce-mcp
    app.kubernetes.io/part-of: agentdock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woocommerce-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woocommerce-mcp
        app.kubernetes.io/part-of: agentdock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: woocommerce-mcp
          image: {{ .Values.images.woocommerceMcp }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WC_BASE_URL
              value: {{ .Values.internalUrls.wordpress | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: shop, key: WC_CONSUMER_KEY } }
            - name: WC_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: shop, key: WC_CONSUMER_SECRET } }
          resources:
            {{- toYaml .Values.resources.mcp | nindent 12 }}
          {{- include "agentdock.nodeProbes" . | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  namespace: {{ .Values.namespaces.shop }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: woocommerce-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- range $name := list "weather-mcp" "fx-mcp" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespaces.platform }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: agentdock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: agentdock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ $name }}
          image: {{ if eq $name "weather-mcp" }}{{ $.Values.images.weatherMcp }}{{ else }}{{ $.Values.images.fxMcp }}{{ end }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            {{- toYaml $.Values.resources.mcp | nindent 12 }}
          {{- include "agentdock.nodeProbes" $ | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespaces.platform }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- end }}
