apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb
  namespace: {{ .Values.namespaces.shop }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.mariadbSize }}
  {{- include "agentdock.storageClass" . | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: {{ .Values.namespaces.shop }}
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: agentdock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/part-of: agentdock
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb }}
          imagePullPolicy: IfNotPresent
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: shop, key: MARIADB_ROOT_PASSWORD } }
            - name: MARIADB_DATABASE
              valueFrom: { secretKeyRef: { name: shop, key: MARIADB_DATABASE } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: shop, key: MARIADB_USER } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: shop, key: MARIADB_PASSWORD } }
          resources:
            {{- toYaml .Values.resources.mariadb | nindent 12 }}
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ .Values.namespaces.shop }}
spec:
  selector:
    app.kubernetes.io/name: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
