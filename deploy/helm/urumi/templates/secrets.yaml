{{- $required := list "mariadbRootPassword" "mariadbPassword" "wordpressAdminPassword" "wcConsumerKey" "wcConsumerSecret" "postgresPassword" "adminPassword" "credentialKey" "adminEmail" }}
{{- range $required }}
{{- if not (index $.Values.secrets .) }}
{{- fail (printf "secrets.%s is required. Generate deploy/helm/urumi/secrets.local.yaml and pass it with -f." .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: shop
  namespace: {{ .Values.namespaces.shop }}
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ .Values.secrets.mariadbRootPassword | quote }}
  MARIADB_DATABASE: {{ .Values.secrets.mariadbDatabase | quote }}
  MARIADB_USER: {{ .Values.secrets.mariadbUser | quote }}
  MARIADB_PASSWORD: {{ .Values.secrets.mariadbPassword | quote }}
  WORDPRESS_DB_NAME: {{ .Values.secrets.mariadbDatabase | quote }}
  WORDPRESS_DB_USER: {{ .Values.secrets.mariadbUser | quote }}
  WORDPRESS_DB_PASSWORD: {{ .Values.secrets.mariadbPassword | quote }}
  WORDPRESS_ADMIN_PASSWORD: {{ .Values.secrets.wordpressAdminPassword | quote }}
  WC_CONSUMER_KEY: {{ .Values.secrets.wcConsumerKey | quote }}
  WC_CONSUMER_SECRET: {{ .Values.secrets.wcConsumerSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: {{ .Values.namespaces.platform }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDatabase | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway
  namespace: {{ .Values.namespaces.platform }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@postgres:5432/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword .Values.secrets.postgresDatabase | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  ADMIN_NAME: {{ .Values.gateway.adminName | quote }}
  GATEWAY_CREDENTIAL_KEY: {{ .Values.secrets.credentialKey | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
