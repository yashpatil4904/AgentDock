{{- if .Values.ingress.tls.certManager }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver
  namespace: {{ .Values.namespaces.shop }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: ["Ingress"]
  ingress:
    {{- include "agentdock.ingressFromController" . | nindent 4 }}
      ports:
        - protocol: TCP
          port: 8089
---
