apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespaces.platform }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agentdock
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: agentdock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: COOKIE_SECURE
              value: {{ .Values.gateway.cookieSecure | quote }}
            - name: GROQ_MODEL
              value: {{ .Values.gateway.groqModel | quote }}
            - name: WOOCOMMERCE_MCP_URL
              value: {{ .Values.internalUrls.woocommerceMcp | quote }}
            - name: WEATHER_MCP_URL
              value: {{ .Values.internalUrls.weatherMcp | quote }}
            - name: FX_MCP_URL
              value: {{ .Values.internalUrls.fxMcp | quote }}
          envFrom:
            - secretRef:
                name: gateway
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespaces.platform }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
