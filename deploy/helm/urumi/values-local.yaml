# Kind + ingress-nginx. shop.localtest.me and app.localtest.me resolve to 127.0.0.1.
ingress:
  className: nginx
  namespace: ingress-nginx
  podLabels:
    app.kubernetes.io/name: ingress-nginx
  shopHost: shop.localtest.me
  appHost: app.localtest.me
  tls:
    enabled: true
    secretName: localtest-tls
    certResolver: ""

storage:
  className: local-path

wordpress:
  url: https://shop.localtest.me

gateway:
  publicUrl: https://app.localtest.me
  cookieSecure: true

stores:
  urlScheme: https

images:
  pullPolicy: IfNotPresent
